model:
  type: "vit"
  name: "vit_b_16"
  num_classes: 37
  fine_tuning:
    strategy: "none"
    num_layers: 0
    unfreeze_every_n_epochs: 0
lora:
  r: 8
  alpha: 16
  learning_rate: 0.0001
  # Only Q and V projections while keeping K frozen
  targets:
    - "self_attention"
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.0005
  seed: 42
data:
  name: "oxford_pets"
  data_dir: "./data"
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
    use_weighted_loss: false
    oversample: false
optimizer:
  name: "adamw"
  lr: 0.0005
  lora_lr: 0.0001
  weight_decay: 0.0
scheduler:
  name: "none"
loss:
  name: "cross_entropy"
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  experiment_name: "Transfer_Learning"
  dagshub_repo_owner: "manuel.voit"
  dagshub_repo_name: "dd2424-project"
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
