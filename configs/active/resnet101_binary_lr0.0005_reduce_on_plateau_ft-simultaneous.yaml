model:
  type: resnet
  name: resnet101
  num_classes: 2
  fine_tuning:
    strategy: simultaneous
    num_layers: 4
    unfreeze_every_n_epochs: 2
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.0005
  seed: 42
data:
  name: oxford_pets_binary
  data_dir: ./data
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
    use_weighted_loss: false
    oversample: false
optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.0
scheduler:
  name: reduce_on_plateau
loss:
  name: cross_entropy
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  experiment_name: resnet101_binary_lr0.0005_reduce_on_plateau_ft-simultaneous
  dagshub_repo_owner: manuel.voit
  dagshub_repo_name: dd2424-project
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
