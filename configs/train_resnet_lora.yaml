model:
  type: "resnet"
  name: "resnet50"
  num_classes: 37
lora:
  r: 8
  alpha: 16
  # Targets the 3x3 convolutions in ResNet blocks
  targets: ["conv2"]
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  seed: 42
data:
  name: "oxford_pets"
  data_dir: "./data"
  image_size: 224
  num_workers: 4
