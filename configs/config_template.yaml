# ALL VALUES
model:
  type: "resnet"
  name: "resnet50" 
  num_classes: 37 
  fine_tuning:
    strategy: "simultaneous"     
    num_layers: 4                
    unfreeze_every_n_epochs: 2   
lora:
  r: 8
  alpha: 16
  targets: []
  gradual_unfreeze:
    enabled: true
    schedule:
        0: ["layer4.2", "layer4.1"]
        3: ["layer4.0", "layer3.5"]
        6: ["layer3.4", "layer3.3"]
        8: ["layer3"]
training:
  batch_size: 128 
  epochs: 10
  learning_rate: 0.001 
  seed: 42
data:
  name: "oxford_pets" 
  data_dir: "./data"
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.4
    use_weighted_loss: false
    oversample: false
optimizer:
  name: "adamw"
  lr: 0.001 
  lora_lr: 0.0001
  weight_decay: 0.0001
scheduler:
  name: "cosine_annealing_lr" 
loss:
  name: "cross_entropy"
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  run_name: "Placeholder"
  experiment_name: "Baseline_Imbalance_Trainfrac_Transfer_Learning" 
  dagshub_repo_owner: "manuel.voit"
  dagshub_repo_name: "dd2424-project"
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
  measure_compute_time: false
