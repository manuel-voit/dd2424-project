model:
  type: resnet
  name: resnet101
  num_classes: 37
  fine_tuning:
    strategy: gradual
    num_layers: 2
    unfreeze_every_n_epochs: 3
training:
  batch_size: 128
  epochs: 15
  learning_rate: 0.0001
  seed: 42
data:
  name: oxford_pets
  data_dir: ./data
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
    use_weighted_loss: false
    oversample: false
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0005
scheduler:
  name: cosine_annealing_lr
loss:
  name: cross_entropy
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  run_name: exp5_resnet101_ft-gradual_nl2_ufe3_lr0.000100_l2-0.0005
  experiment_name: Exp5_Gradual_Unfreezing
  dagshub_repo_owner: manuel.voit
  dagshub_repo_name: dd2424-project
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
  measure_compute_time: false
