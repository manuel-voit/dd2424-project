model:
  type: resnet
  name: resnet50
  num_classes: 37
  fine_tuning:
    strategy: none
    num_layers: 0
    unfreeze_every_n_epochs: 0
training:
  batch_size: 128
  epochs: 10
  learning_rate: 0.01
  seed: 42
data:
  name: oxford_pets
  data_dir: ./data
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
    use_weighted_loss: false
    oversample: false
optimizer:
  name: adamw
  lr: 0.01
  weight_decay: 5.0e-05
scheduler:
  name: cosine_annealing_lr
loss:
  name: cross_entropy
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  run_name: exp3_resnet50_ft-none_lr0.010000_l2-5e-05_epochs10
  experiment_name: Exp3_LinearProbing_WeightDecay_and_Epochs
  dagshub_repo_owner: manuel.voit
  dagshub_repo_name: dd2424-project
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
  measure_compute_time: false
