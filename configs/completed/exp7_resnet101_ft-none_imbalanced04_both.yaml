model:
  type: resnet
  name: resnet101
  num_classes: 37
  fine_tuning:
    strategy: none
    num_layers: 0
    unfreeze_every_n_epochs: 1
training:
  batch_size: 128
  epochs: 10
  learning_rate: 0.005
  seed: 42
data:
  name: oxford_pets
  data_dir: ./data
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: true
    imbalance_factor: 0.4
    use_weighted_loss: true
    oversample: true
optimizer:
  name: adamw
  lr: 0.005
  weight_decay: 0.0001
scheduler:
  name: cosine_annealing_lr
loss:
  name: cross_entropy
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  run_name: exp7_resnet101_ft-none_imbalanced04_both
  experiment_name: Exp7_ClassImbalance_and_Countermeasures
  dagshub_repo_owner: manuel.voit
  dagshub_repo_name: dd2424-project
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
  measure_compute_time: false
