model:
  type: resnet
  name: resnet101
  num_classes: 37
  fine_tuning:
    strategy: none
    num_layers: 0
    unfreeze_every_n_epochs: 0
lora:
  r: 8
  alpha: 16
  targets:
  - layer3
  - layer4
  gradual_unfreeze:
    enabled: true
    schedule:
      3:
      - layer4.2
      - layer4.1
      - layer4.0
      - layer3.22
      6:
      - layer3.21
      - layer3.20
      - layer3.19
      - layer3.18
      9:
      - layer3.17
      - layer3.16
      - layer3.15
      - layer3.14
      12:
      - layer3.13
      - layer3.12
      - layer3.11
      - layer3.10
  learning_rate: 0.001
training:
  batch_size: 128
  epochs: 15
  learning_rate: 0.0001
  seed: 42
data:
  name: oxford_pets
  data_dir: ./data
  image_size: 224
  train_fraction: 1.0
  augmentation: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
    use_weighted_loss: false
    oversample: false
optimizer:
  name: adamw
  lr: 0.0001
  lora_lr: 0.001
  weight_decay: 0.0001
scheduler:
  name: cosine_annealing_lr
loss:
  name: cross_entropy
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  run_name: exp11_resnet101_lora-general_stage34_r8_nblocks4_ufe3
  experiment_name: Exp11_LoRA_Gradual_Unfreezing
  dagshub_repo_owner: manuel.voit
  dagshub_repo_name: dd2424-project
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
  measure_compute_time: false
