model:
  type: "resnet"
  name: "resnet50" # Options: resnet18, resnet34, resnet50, resnet101
  num_classes: 2
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  seed: 42
data:
  name: "oxford_pets_binary"
  data_dir: "./data"
  image_size: 224
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
optimizer:
  name: "adamw"
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: "none"
loss:
  name: "cross_entropy"
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.0
logging:
  enabled: true
  experiment_name: "Transfer_Learning"
  dagshub_repo_owner: "manuel.voit"
  dagshub_repo_name: "dd2424-project"
  log_metrics: true
  log_confusion_matrix: true
  log_artifact: true
