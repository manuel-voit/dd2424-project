model:
  type: "vit"
  name: "swin_t"
  num_classes: 10
lora:
  r: 8
  alpha: 16
  # Targets the Attention Query/Key/Value projections
  targets: ["qkv"]
training:
  batch_size: 32
  epochs: 10
  # ViTs usually require a smaller learning rate
  learning_rate: 0.0005
  seed: 42
data:
  data_dir: "./data"
  image_size: 224
  num_workers: 4