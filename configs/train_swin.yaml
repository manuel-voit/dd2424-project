model:
  type: "vit"
  name: "swin_t"
  num_classes: 37
training:
  batch_size: 32
  epochs: 10
  # ViTs usually require a smaller learning rate
  learning_rate: 0.0005
  seed: 42
data:
  name: "oxford_pets"
  data_dir: "./data"
  image_size: 224
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  imbalance:
    enabled: false
    imbalance_factor: 0.2
